# Google + Apple OAuth providers are configured directly in the Supabase
# dashboard (Authentication → Providers) rather than via this CLI config.
# This avoids requiring the OAuth credentials to be present on every
# `supabase link` / `db push`. Enable here only if you want to drive auth
# config from code; otherwise leave commented and use the dashboard.
#
# [auth.external.google]
# enabled = true
# client_id = "env(EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID)"
# secret = "env(GOOGLE_OAUTH_SECRET)"
# redirect_uri = ""
#
# [auth.external.apple]
# enabled = true
# client_id = "env(APPLE_SERVICE_ID)"
# secret = "env(APPLE_OAUTH_SECRET)"
